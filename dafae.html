<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الدفع - 49 درهم</title>
</head>
<body style="font-family:Arial; background:#f5f5f5; padding:20px;">

<div style="max-width:500px; margin:auto; background:white; padding:20px; border-radius:15px;">

<h1 style="text-align:center;">🚀 خدمة الدفع في 9 مواقع</h1>
<p style="text-align:center;">كن دفعو لك السيفي ديالك كل نهار فـ Anapec, Indeed, Emploi.ma...</p>

<!-- صندوق الدفع الجديد بسميتك -->
<div style="background:#FFF9C4; border:2px dashed #FBC02D; padding:20px; border-radius:15px; text-align:center; margin:20px 0;">
  <h2>💳 خلص 49 درهم عبر كاش بلوس</h2>
  <div style="background:white; padding:15px; border-radius:10px; text-align:right;">
    <p><b>👤 الإسم:</b> Hamza Dahyaoui</p>
    <p><b>📱 رقم كاش بلوس:</b> 0723300523</p>
    <p><b>💰 المبلغ:</b> 49 درهم</p>
  </div>
  <p style="color:red; font-weight:bold; margin-top:15px;">صور الوصل وطلعو هنا:</p>
  <input type="file" id="receipt" accept="image/*" style="margin:10px 0; padding:10px; border:1px solid #ccc; border-radius:8px; width:90%;">
  <input type="tel" id="client_whatsapp" placeholder="رقم واتساب ديالك" style="margin:10px 0; padding:12px; border:1px solid #ccc; border-radius:8px; width:90%; text-align:center;">
  <button onclick="confirmPayment()" style="background:#25D366; color:white; border:none; padding:15px; border-radius:10px; font-size:18px; font-weight:bold; width:100%; cursor:pointer;">
    ✅ تأكيد الدفع وبدء الخدمة
  </button>
  <p id="msg" style="margin-top:15px;"></p>
</div>

</div>

<script>
function confirmPayment(){
  const receipt = document.getElementById('receipt').files[0];
  const whatsapp = document.getElementById('client_whatsapp').value;
  if(!receipt ||!whatsapp){
    alert('عافاك صور الوصل ودير رقم واتساب');
    return;
  }
  const message = `سلام حمزة! خلصت 49 درهم كاش بلوس على 0723300523. رقمي هو ${whatsapp}`;
  window.open(`https://wa.me/212723300523?text=${encodeURIComponent(message)}`, '_blank');
  document.getElementById('msg').innerHTML = "✅ تم! تواصل معك حمزة دابا";
}
</script>

</body>
</html>
